services:
  # PostgreSQL with pgvector for local development
  postgres:
    image: pgvector/pgvector:pg15
    container_name: crs-postgres
    environment:
      - POSTGRES_USER=crsadmin
      - POSTGRES_PASSWORD=YourStrong@Passw0rd
      - POSTGRES_DB=crsdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crsadmin -d crsdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # CRS API
  api:
    build:
      context: .
      dockerfile: src/Crs.Api/Dockerfile
    container_name: crs-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=crsdb;Username=crsadmin;Password=YourStrong@Passw0rd
      - OpenAI__ApiKey=${OpenAI__ApiKey}
      - Embedding__ModelName=text-embedding-3-small
      - Embedding__Dimensions=1536
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-your-development-secret-key-change-in-production}
      - JwtSettings__Issuer=http://localhost:8080
      - JwtSettings__Audience=http://localhost:5001
      - Cors__AllowedOrigins__0=http://localhost:5001
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crs-network

  # CRS Web (Blazor)
  web:
    build:
      context: .
      dockerfile: src/Crs.Web/Dockerfile
    container_name: crs-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - API_BASE_URL=http://api:8080
    ports:
      - "5001:8080"
    depends_on:
      - api
    networks:
      - crs-network

  # CRS Jobs (Run manually with docker compose exec)
  # To run ingestion: docker compose exec jobs dotnet Crs.Jobs.dll ingestion
  # To run feed generation: docker compose exec jobs dotnet Crs.Jobs.dll feed
  jobs:
    build:
      context: .
      dockerfile: src/Crs.Jobs/Dockerfile
    container_name: crs-jobs
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=crsdb;Username=crsadmin;Password=YourStrong@Passw0rd
      - OpenAI__ApiKey=${OpenAI__ApiKey}
      - Embedding__ModelName=text-embedding-3-small
      - Embedding__Dimensions=1536
      - OpenAI__Model=gpt-5-nano
      - OpenAI__MaxTokens=4096
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crs-network
    # Override entrypoint to keep container running for manual job execution
    entrypoint: ["/bin/sh", "-c"]
    command: ["tail -f /dev/null"]

networks:
  crs-network:
    driver: bridge

volumes:
  postgres_data:
