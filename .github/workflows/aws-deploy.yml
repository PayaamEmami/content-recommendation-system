name: Build and Deploy to AWS

concurrency:
  group: aws-deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_infrastructure:
        description: "Deploy infrastructure changes"
        required: false
        default: false
        type: boolean

env:
  DOTNET_VERSION: "10.0.x"
  AWS_REGION: us-west-2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t crs-api:latest -f ./src/Crs.Api/Dockerfile .
          docker tag crs-api:latest $ECR_REGISTRY/crs-api:latest
          docker tag crs-api:latest $ECR_REGISTRY/crs-api:${{ github.sha }}
          docker push $ECR_REGISTRY/crs-api:latest
          docker push $ECR_REGISTRY/crs-api:${{ github.sha }}

      - name: Build and push Jobs Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t crs-jobs:latest -f ./src/Crs.Jobs/Dockerfile .
          docker tag crs-jobs:latest $ECR_REGISTRY/crs-jobs:latest
          docker tag crs-jobs:latest $ECR_REGISTRY/crs-jobs:${{ github.sha }}
          docker push $ECR_REGISTRY/crs-jobs:latest
          docker push $ECR_REGISTRY/crs-jobs:${{ github.sha }}

      - name: Publish Blazor WebAssembly
        run: dotnet publish src/Crs.Web/Crs.Web.csproj -c Release -o publish/web

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: publish/web/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app
          path: web-app

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stamp web config with live API URL
        run: |
          SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='crs-api'].ServiceArn" --output text)
          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
            echo "App Runner service not found - cannot resolve API URL for web config"
            exit 1
          fi

          API_URL=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query "Service.ServiceUrl" --output text)
          API_BASE_URL="https://${API_URL}"

          sed -i "s|\"ApiBaseUrl\": \".*\"|\"ApiBaseUrl\": \"${API_BASE_URL}\"|" web-app/appsettings.json
          if [ -f web-app/appsettings.Production.json ]; then
            sed -i "s|\"ApiBaseUrl\": \".*\"|\"ApiBaseUrl\": \"${API_BASE_URL}\"|" web-app/appsettings.Production.json
          fi

          echo "Stamped web config with ${API_BASE_URL}"

      - name: Deploy to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="crs-web-${ACCOUNT_ID}"

          echo "Deploying to S3 bucket: $BUCKET_NAME"
          aws s3 sync web-app s3://$BUCKET_NAME --delete

          # Set cache headers and content types for static assets
          aws s3 cp s3://$BUCKET_NAME/ s3://$BUCKET_NAME/ \
            --recursive \
            --exclude "*" \
            --include "*.js" \
            --metadata-directive REPLACE \
            --cache-control "max-age=31536000" \
            --content-type "application/javascript"

          aws s3 cp s3://$BUCKET_NAME/ s3://$BUCKET_NAME/ \
            --recursive \
            --exclude "*" \
            --include "*.css" \
            --metadata-directive REPLACE \
            --cache-control "max-age=31536000" \
            --content-type "text/css"

          aws s3 cp s3://$BUCKET_NAME/ s3://$BUCKET_NAME/ \
            --recursive \
            --exclude "*" \
            --include "*.woff2" \
            --metadata-directive REPLACE \
            --cache-control "max-age=31536000" \
            --content-type "font/woff2"

          aws s3 cp s3://$BUCKET_NAME/ s3://$BUCKET_NAME/ \
            --recursive \
            --exclude "*" \
            --include "*.wasm" \
            --metadata-directive REPLACE \
            --cache-control "max-age=31536000" \
            --content-type "application/wasm"

          # HTML files should have shorter cache
          aws s3 cp s3://$BUCKET_NAME/index.html s3://$BUCKET_NAME/index.html \
            --metadata-directive REPLACE \
            --cache-control "max-age=300" \
            --content-type "text/html"

      - name: Update App Runner service
        run: |
          SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='crs-api'].ServiceArn" --output text)
          if [ -n "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
            echo "Waiting for App Runner service to be RUNNING..."
            for i in {1..30}; do
              STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query "Service.Status" --output text)
              if [ "$STATUS" = "RUNNING" ]; then
                break
              fi
              echo "Current status: $STATUS (attempt $i/30)"
              sleep 10
            done

            STATUS=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query "Service.Status" --output text)
            if [ "$STATUS" != "RUNNING" ]; then
              echo "App Runner service not in RUNNING state ($STATUS). Skipping deployment."
              exit 0
            fi

            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            IMAGE_ID="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/crs-api:${GITHUB_SHA}"

            echo "Updating App Runner image to $IMAGE_ID"
            SOURCE_CONFIG=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query "Service.SourceConfiguration" --output json)
            UPDATED_CONFIG=$(echo "$SOURCE_CONFIG" | jq --arg image "$IMAGE_ID" '.ImageRepository.ImageIdentifier = $image')

            aws apprunner update-service --service-arn "$SERVICE_ARN" --source-configuration "$UPDATED_CONFIG"
            echo "Deployment update submitted"
          else
            echo "App Runner service not found - skipping deployment"
          fi

      - name: Invalidate CloudFront cache
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="crs-web-${ACCOUNT_ID}"

          # Match distributions whose origin domain contains the bucket name
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Origins.Items[?contains(DomainName, '${BUCKET_NAME}')]].Id | [0]" --output text 2>/dev/null || echo "")
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            echo "Invalidating CloudFront cache for distribution $DIST_ID..."
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          else
            echo "CloudFront distribution not found - skipping invalidation"
          fi

      - name: Print deployment info
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="crs-web-${ACCOUNT_ID}"

          SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='crs-api'].ServiceArn" --output text 2>/dev/null || echo "")
          API_URL=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='crs-api'].ServiceUrl" --output text 2>/dev/null || echo "not-deployed")
          API_LOG_GROUP="not-available"
          if [ -n "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
            SERVICE_ID=$(aws apprunner describe-service --service-arn "$SERVICE_ARN" --query "Service.ServiceId" --output text)
            API_LOG_GROUP="/aws/apprunner/crs-api/${SERVICE_ID}/application"
          fi
          WEB_URL="http://${BUCKET_NAME}.s3-website-${{ env.AWS_REGION }}.amazonaws.com"

          echo "=============================================="
          echo "Deployment Complete!"
          echo "=============================================="
          echo "API URL: https://${API_URL}"
          echo "Web URL: ${WEB_URL}"
          echo "API Logs: ${API_LOG_GROUP}"
          echo "=============================================="
