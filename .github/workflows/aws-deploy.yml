name: Build and Deploy to AWS

concurrency:
  group: aws-deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_infrastructure:
        description: "Deploy infrastructure changes"
        required: false
        default: false
        type: boolean

env:
  DOTNET_VERSION: "10.0.x"
  AWS_REGION: us-west-2
  API_URL_SOURCE: ecs-express
  DEPLOY_ECS_EXPRESS: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      api_image_identifier: ${{ steps.api-image.outputs.image_identifier }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t crs-api:latest -f ./src/Crs.Api/Dockerfile .
          docker tag crs-api:latest $ECR_REGISTRY/crs-api:latest
          docker tag crs-api:latest $ECR_REGISTRY/crs-api:${{ github.sha }}
          docker push $ECR_REGISTRY/crs-api:latest
          docker push $ECR_REGISTRY/crs-api:${{ github.sha }}

      - name: Resolve API image digest
        id: api-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          DIGEST=$(aws ecr describe-images --repository-name crs-api --image-ids imageTag=${{ github.sha }} --query "imageDetails[0].imageDigest" --output text)
          echo "image_identifier=$ECR_REGISTRY/crs-api@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build and push Jobs Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t crs-jobs:latest -f ./src/Crs.Jobs/Dockerfile .
          docker tag crs-jobs:latest $ECR_REGISTRY/crs-jobs:latest
          docker tag crs-jobs:latest $ECR_REGISTRY/crs-jobs:${{ github.sha }}
          docker push $ECR_REGISTRY/crs-jobs:latest
          docker push $ECR_REGISTRY/crs-jobs:${{ github.sha }}

      - name: Publish Blazor WebAssembly
        run: dotnet publish src/Crs.Web/Crs.Web.csproj -c Release -o publish/web

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: publish/web/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      API_IMAGE_IDENTIFIER: ${{ needs.build.outputs.api_image_identifier }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app
          path: web-app

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stamp web config with live API URL
        run: |
          normalize_api_base_url() {
            if [[ "$1" == http://* || "$1" == https://* ]]; then
              echo "$1"
            else
              echo "https://$1"
            fi
          }

          resolve_ecs_express_api_base_url() {
            SERVICE_ARN=$(aws ecs list-services --cluster crs-cluster --query "serviceArns[?contains(@, '/crs-api')] | [0]" --output text)
            if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
              echo "ECS Express service not found - cannot resolve API URL for web config"
              exit 1
            fi

            API_URL=$(aws ecs describe-express-gateway-service --service-arn "$SERVICE_ARN" --query "service.activeConfigurations[0].ingressPaths[0].endpoint" --output text)
            if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
              echo "ECS Express endpoint not found - cannot resolve API URL for web config"
              exit 1
            fi

            normalize_api_base_url "$API_URL"
          }

          case "${API_URL_SOURCE,,}" in
            ecs-express)
              API_BASE_URL=$(resolve_ecs_express_api_base_url)
              ;;
            explicit)
              if [ -z "${API_BASE_URL_EXPLICIT:-}" ]; then
                echo "API_BASE_URL_EXPLICIT must be set when API_URL_SOURCE=explicit"
                exit 1
              fi
              API_BASE_URL=$(normalize_api_base_url "$API_BASE_URL_EXPLICIT")
              ;;
            *)
              echo "Unsupported API_URL_SOURCE: $API_URL_SOURCE"
              exit 1
              ;;
          esac

          sed -i "s|\"ApiBaseUrl\": \".*\"|\"ApiBaseUrl\": \"${API_BASE_URL}\"|" web-app/appsettings.json
          if [ -f web-app/appsettings.Production.json ]; then
            sed -i "s|\"ApiBaseUrl\": \".*\"|\"ApiBaseUrl\": \"${API_BASE_URL}\"|" web-app/appsettings.Production.json
          fi

          echo "Stamped web config with ${API_BASE_URL} from ${API_URL_SOURCE}"

      - name: Deploy to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="crs-web-${ACCOUNT_ID}"

          echo "Deploying to S3 bucket: $BUCKET_NAME"
          aws s3 sync web-app s3://$BUCKET_NAME --delete

          # Set cache headers and content types for static assets
          aws s3 cp s3://$BUCKET_NAME/ s3://$BUCKET_NAME/ \
            --recursive \
            --exclude "*" \
            --include "*.js" \
            --metadata-directive REPLACE \
            --cache-control "max-age=31536000" \
            --content-type "application/javascript"

          aws s3 cp s3://$BUCKET_NAME/ s3://$BUCKET_NAME/ \
            --recursive \
            --exclude "*" \
            --include "*.css" \
            --metadata-directive REPLACE \
            --cache-control "max-age=31536000" \
            --content-type "text/css"

          aws s3 cp s3://$BUCKET_NAME/ s3://$BUCKET_NAME/ \
            --recursive \
            --exclude "*" \
            --include "*.woff2" \
            --metadata-directive REPLACE \
            --cache-control "max-age=31536000" \
            --content-type "font/woff2"

          aws s3 cp s3://$BUCKET_NAME/ s3://$BUCKET_NAME/ \
            --recursive \
            --exclude "*" \
            --include "*.wasm" \
            --metadata-directive REPLACE \
            --cache-control "max-age=31536000" \
            --content-type "application/wasm"

          # HTML files should have shorter cache
          aws s3 cp s3://$BUCKET_NAME/index.html s3://$BUCKET_NAME/index.html \
            --metadata-directive REPLACE \
            --cache-control "max-age=300" \
            --content-type "text/html"

      - name: Update ECS Express service
        if: env.DEPLOY_ECS_EXPRESS == 'true'
        run: |
          SERVICE_ARN=$(aws ecs list-services --cluster crs-cluster --query "serviceArns[?contains(@, '/crs-api')] | [0]" --output text)
          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
            echo "ECS Express service not found - skipping deployment"
            exit 1
          fi

          PRIMARY_CONTAINER=$(aws ecs describe-express-gateway-service --service-arn "$SERVICE_ARN" --query "service.activeConfigurations[0].primaryContainer" --output json)
          UPDATED_PRIMARY=$(echo "$PRIMARY_CONTAINER" | python -c 'import json,sys; payload=json.load(sys.stdin); payload["image"]=sys.argv[1]; print(json.dumps(payload, separators=(",", ":")))' "$API_IMAGE_IDENTIFIER")

          aws ecs update-express-gateway-service --service-arn "$SERVICE_ARN" --primary-container "$UPDATED_PRIMARY"
          echo "Submitted ECS Express deployment with $API_IMAGE_IDENTIFIER"

          for i in {1..60}; do
            STATUS=$(aws ecs describe-express-gateway-service --service-arn "$SERVICE_ARN" --query "service.status.statusCode" --output text)
            if [ "$STATUS" = "ACTIVE" ]; then
              break
            fi
            echo "Current ECS Express status: $STATUS (attempt $i/60)"
            sleep 10
          done

          STATUS=$(aws ecs describe-express-gateway-service --service-arn "$SERVICE_ARN" --query "service.status.statusCode" --output text)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS Express service not ACTIVE ($STATUS)"
            exit 1
          fi

      - name: Invalidate CloudFront cache
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="crs-web-${ACCOUNT_ID}"

          # Match distributions whose origin domain contains the bucket name
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Origins.Items[?contains(DomainName, '${BUCKET_NAME}')]].Id | [0]" --output text 2>/dev/null || echo "")
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            echo "Invalidating CloudFront cache for distribution $DIST_ID..."
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          else
            echo "CloudFront distribution not found - skipping invalidation"
          fi

      - name: Print deployment info
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="crs-web-${ACCOUNT_ID}"

          ECS_EXPRESS_SERVICE_ARN=$(aws ecs list-services --cluster crs-cluster --query "serviceArns[?contains(@, '/crs-api')] | [0]" --output text 2>/dev/null || echo "")
          ECS_EXPRESS_URL="not-deployed"
          if [ -n "$ECS_EXPRESS_SERVICE_ARN" ] && [ "$ECS_EXPRESS_SERVICE_ARN" != "None" ]; then
            ECS_EXPRESS_URL=$(aws ecs describe-express-gateway-service --service-arn "$ECS_EXPRESS_SERVICE_ARN" --query "service.activeConfigurations[0].ingressPaths[0].endpoint" --output text 2>/dev/null || echo "not-deployed")
          fi
          WEB_URL="http://${BUCKET_NAME}.s3-website-${{ env.AWS_REGION }}.amazonaws.com"

          echo "=============================================="
          echo "Deployment Complete!"
          echo "=============================================="
          echo "ECS Express API URL: https://${ECS_EXPRESS_URL}"
          echo "Web API source: ${API_URL_SOURCE}"
          echo "Web URL: ${WEB_URL}"
          echo "ECS Express API Logs: /crs/api"
          echo "=============================================="
