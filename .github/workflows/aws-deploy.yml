name: Build and Deploy to AWS

concurrency:
  group: aws-deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  AWS_REGION: us-west-2
  API_URL_SOURCE: lightsail
  STATIC_IP_NAME: crs-lightsail-ip

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Configure AWS credentials
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API Docker image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t crs-api:latest -f ./src/Crs.Api/Dockerfile .
          docker tag crs-api:latest $ECR_REGISTRY/crs-api:latest
          docker tag crs-api:latest $ECR_REGISTRY/crs-api:${{ github.sha }}
          docker push $ECR_REGISTRY/crs-api:latest
          docker push $ECR_REGISTRY/crs-api:${{ github.sha }}

      - name: Build and push Jobs Docker image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t crs-jobs:latest -f ./src/Crs.Jobs/Dockerfile .
          docker tag crs-jobs:latest $ECR_REGISTRY/crs-jobs:latest
          docker tag crs-jobs:latest $ECR_REGISTRY/crs-jobs:${{ github.sha }}
          docker push $ECR_REGISTRY/crs-jobs:latest
          docker push $ECR_REGISTRY/crs-jobs:${{ github.sha }}

      - name: Publish Blazor WebAssembly
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: dotnet publish src/Crs.Web/Crs.Web.csproj -c Release -o publish/web

      - name: Upload Web artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: publish/web/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app
          path: web-app

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stamp web config with Lightsail API URL
        run: |
          STATIC_IP=$(aws lightsail get-static-ip \
            --static-ip-name "${STATIC_IP_NAME}" \
            --region "${AWS_REGION}" \
            --query 'staticIp.ipAddress' \
            --output text)
          if [ -z "$STATIC_IP" ] || [ "$STATIC_IP" = "None" ]; then
            echo "Lightsail static IP ${STATIC_IP_NAME} not found"
            exit 1
          fi
          API_BASE_URL="https://${STATIC_IP}.sslip.io"
          sed -i "s|\"ApiBaseUrl\": \".*\"|\"ApiBaseUrl\": \"${API_BASE_URL}\"|" web-app/appsettings.json
          if [ -f web-app/appsettings.Production.json ]; then
            sed -i "s|\"ApiBaseUrl\": \".*\"|\"ApiBaseUrl\": \"${API_BASE_URL}\"|" web-app/appsettings.Production.json
          fi
          echo "Stamped web config with ${API_BASE_URL}"
          echo "API_BASE_URL=${API_BASE_URL}" >> "$GITHUB_ENV"

      - name: Deploy to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="crs-web-${ACCOUNT_ID}"

          echo "Deploying to S3 bucket: $BUCKET_NAME"
          aws s3 sync web-app s3://$BUCKET_NAME --delete

          aws s3 cp s3://$BUCKET_NAME/ s3://$BUCKET_NAME/ \
            --recursive \
            --exclude "*" \
            --include "*.js" \
            --metadata-directive REPLACE \
            --cache-control "max-age=31536000" \
            --content-type "application/javascript"

          aws s3 cp s3://$BUCKET_NAME/ s3://$BUCKET_NAME/ \
            --recursive \
            --exclude "*" \
            --include "*.css" \
            --metadata-directive REPLACE \
            --cache-control "max-age=31536000" \
            --content-type "text/css"

          aws s3 cp s3://$BUCKET_NAME/ s3://$BUCKET_NAME/ \
            --recursive \
            --exclude "*" \
            --include "*.woff2" \
            --metadata-directive REPLACE \
            --cache-control "max-age=31536000" \
            --content-type "font/woff2"

          aws s3 cp s3://$BUCKET_NAME/ s3://$BUCKET_NAME/ \
            --recursive \
            --exclude "*" \
            --include "*.wasm" \
            --metadata-directive REPLACE \
            --cache-control "max-age=31536000" \
            --content-type "application/wasm"

          for NON_FP_FILE in "_framework/blazor.webassembly.js" "_framework/dotnet.js"; do
            if aws s3api head-object --bucket "$BUCKET_NAME" --key "$NON_FP_FILE" > /dev/null 2>&1; then
              aws s3 cp "s3://$BUCKET_NAME/$NON_FP_FILE" "s3://$BUCKET_NAME/$NON_FP_FILE" \
                --metadata-directive REPLACE \
                --cache-control "no-cache" \
                --content-type "application/javascript"
            fi
          done

          aws s3 cp s3://$BUCKET_NAME/index.html s3://$BUCKET_NAME/index.html \
            --metadata-directive REPLACE \
            --cache-control "no-cache" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="crs-web-${ACCOUNT_ID}"
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Origins.Items[?contains(DomainName, '${BUCKET_NAME}')]].Id | [0]" --output text 2>/dev/null || echo "")
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            echo "Invalidating CloudFront cache for distribution $DIST_ID..."
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          else
            echo "CloudFront distribution not found - skipping invalidation"
          fi

      - name: Print deployment info
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="crs-web-${ACCOUNT_ID}"
          WEB_URL="http://${BUCKET_NAME}.s3-website-${{ env.AWS_REGION }}.amazonaws.com"
          echo "=============================================="
          echo "Deployment Complete!"
          echo "=============================================="
          echo "Lightsail API URL: ${API_BASE_URL}"
          echo "Web URL: ${WEB_URL}"
          echo "Note: pull new API image on the instance with infrastructure/aws/deploy-lightsail.sh"
          echo "=============================================="
