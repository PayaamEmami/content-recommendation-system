<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Recommendation System</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="Crs.Web.styles.css" />
    <style>
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-secondary, #181818);
            color: var(--text-primary, #cccccc);
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color, #2b2b2b);
            border-top-color: var(--accent-color, #0078d4);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-container p {
            font-size: 1rem;
            color: var(--text-secondary, #9d9d9d);
        }
        @media (prefers-reduced-motion: reduce) {
            .loading-spinner {
                animation: none;
            }
        }
    </style>
</head>

<body class="dark-mode">
    <div id="app">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p>Loading application...</p>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">Dismiss</a>
    </div>

    <script src="js/observability.js"></script>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
